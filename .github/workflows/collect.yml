name: Collect hot trends

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect daily hot lists
        run: node collect.js
      - name: Commit updated snapshot
        run: |
          git config user.name "wavekol-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/hot-trends.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "chore: daily hot trend snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
